name: CI/CD

# Entry workflow. Pull requests and pushes to main: tests only (pushes to main also refresh the
# coverage badge on the orphan `badges` branch).
# Semantic version tags (vX.Y.Z) on main: tests, then the container is built with podman,
# smoke-tested against a MySQL container (auto-migrate, login, /admin, a rendered front page, a
# reading_events row for an opened PDF, healthcheck, /metrics) and published to GHCR tagged with
# that version, and a GitHub Release is created.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  coverage-badge:
    # Pushes to main only: writes coverage.json (shields.io endpoint format) to the orphan `badges`
    # branch, which the README's Coverage badge reads.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Publish coverage.json to the badges branch
        env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$COVERAGE" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
            echo "Unexpected coverage total: '$COVERAGE'"
            exit 1
          fi

          color="$(awk -v c="$COVERAGE" 'BEGIN {
            if (c >= 80) print "brightgreen"
            else if (c >= 60) print "yellowgreen"
            else if (c >= 40) print "yellow"
            else print "orange"
          }')"

          workdir="$(mktemp -d)"
          cd "$workdir"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$COVERAGE" "$color" > coverage.json
          cat coverage.json

          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit --quiet -m "chore(badges): coverage ${COVERAGE}% for ${SOURCE_SHA}"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "${SERVER_URL}/${REPOSITORY}.git" HEAD:refs/heads/badges

  image:
    # The container is only created for a semantic version tag (vX.Y.Z) that points at a commit on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Work out the version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MINOR=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          # GHCR needs a lower-case repository name.
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      # The smoke test runs scripts/make-samples.mjs on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Podman builds OCI images by default, which silently drop HEALTHCHECK: --format docker keeps it.
      - name: Build image with podman (loaded locally, not pushed yet)
        run: |
          podman build --format docker -f Containerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${VERSION}" \
            --label org.opencontainers.image.title="newspaper" \
            -t newspaper:smoke .
      # MySQL 8.4 and the app on a private podman network, synthetic editions mounted read-only, a
      # local admin made with the image's CLI, then: tables created by the auto-migrate (SHOW
      # TABLES), /login 200 without the Google button, /auth/google 404, login cookie, /admin 200,
      # /thumb/<id> image/jpeg (poppler is in the image), /pdf/<id> writes a reading_events row,
      # HEALTHCHECK, and :9464/metrics with newspaper_editions_opened_total. The script prints the
      # container logs when a check fails and removes its containers, network and volume.
      - name: Smoke test the image
        run: scripts/smoke-image.sh localhost/newspaper:smoke
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image (version, major.minor, latest)
        run: |
          set -eu
          for tag in "${VERSION}" "${MINOR}" latest; do
            podman tag localhost/newspaper:smoke "${IMAGE}:${tag}"
            podman push "${IMAGE}:${tag}"
          done

  release:
    # Only for a version tag that points at a commit on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            --notes "Image: \`${image}\`"
