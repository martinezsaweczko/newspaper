name: CI/CD

# Entry workflow. Pull requests and pushes to main: tests only.
# Semantic version tags (vX.Y.Z) on main: tests, then the container is built with podman,
# smoke-tested (login, a rendered front page, healthcheck, /metrics) and published to GHCR tagged
# with that version, and a GitHub Release is created.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    # The container is only created for a semantic version tag (vX.Y.Z) that points at a commit on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Work out the version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MINOR=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          # GHCR needs a lower-case repository name.
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      # The smoke test runs scripts/make-samples.mjs on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Podman builds OCI images by default, which silently drop HEALTHCHECK: --format docker keeps it.
      - name: Build image with podman (loaded locally, not pushed yet)
        run: |
          podman build --format docker -f Containerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${VERSION}" \
            --label org.opencontainers.image.title="newspaper" \
            -t newspaper:smoke .
      # Synthetic editions mounted read-only, a user made with the image's CLI, then: /login 200,
      # login cookie, /thumb/<id> image/jpeg (poppler is in the image), HEALTHCHECK, and :9464/metrics
      # with newspaper_* series. The script prints the container logs when a check fails.
      - name: Smoke test the image
        run: scripts/smoke-image.sh localhost/newspaper:smoke
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image (version, major.minor, latest)
        run: |
          set -eu
          for tag in "${VERSION}" "${MINOR}" latest; do
            podman tag localhost/newspaper:smoke "${IMAGE}:${tag}"
            podman push "${IMAGE}:${tag}"
          done

  release:
    # Only for a version tag that points at a commit on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            --notes "Image: \`${image}\`"
